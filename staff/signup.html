<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Eventify - Sign Up</title><link rel="stylesheet" href="style.css"></head>
<body data-page="signup">
<div class="page">
<div class="auth-side"><div class="side-content"><div class="side-logo">Eventify</div><div class="side-title">Fast Scan,<br>Smooth Entry.</div><div class="side-text">Make event check-in simple and easy for every guest.</div></div></div>
<div class="auth-main"><div class="auth-box">
<div class="logo">Eventify</div><h1 class="auth-title">Create your Account</h1><p class="auth-sub">Join Eventify as an event staff member</p>
<form id="signupForm">
<div class="form-group"><label>Full Name</label><input id="name" type="text" autocomplete="name"></div>
<div class="form-group"><label>Email Address</label><input id="email" type="email" autocomplete="email"></div>
<div class="form-group"><label>Password</label><input id="password" type="password" autocomplete="new-password"></div>
<button class="main-btn" type="submit">Sign Up</button>
</form>
<div id="message" class="message"></div>
<p class="text-link">Already have an account? <a href="login.html" id="loginLink" type="button">Log in</a></p>
</div></div></div>
<script src="backend.js"></script><script src="app.js"></script></body></html>
