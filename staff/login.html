<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Eventify - Login</title>
        <link rel="stylesheet" href="style.css"></head>
<body data-page="login">
<div class="page">
<div class="auth-side">
    <div class="side-content"><div class="side-logo">Eventify</div><div class="side-title">Fast Scan,<br>Smooth Entry.</div><div class="side-text">Welcome back. Manage your event check-ins from one place.</div></div></div>
<div class="auth-main">
    <div class="auth-box">
<div class="logo">Eventify</div>
<h1 class="auth-title">Welcome Back</h1>
<p class="auth-sub">Log in to your staff account</p>
<form id="loginForm">
<div class="form-group">
    <label>Email Address</label><input id="email" type="email" autocomplete="email"></div>
<div class="form-group"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="main-btn" type="submit">Log In</button>
</form>
<div id="message" class="message"></div><p class="text-link">Don't have an account? 
    <a href="signup.html" id="signupLink" type="button">Sign up</a></p>
</div></div></div>
<script src="backend.js"></script><script src="app.js"></script></body></html>
