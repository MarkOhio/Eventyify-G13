<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Eventify - Scan Result</title><link rel="stylesheet" href="style.css"></head>
<body data-page="result">
<div class="result-page"><div class="result-box">
<div id="resultIcon" class="result-icon green">✓</div><h1 id="resultTitle">Check-in Successful!</h1><p id="resultText"></p>
<div class="result-card">Event: <span id="resultEvent"></span><br>Status: <span id="resultStatus"></span></div>
<div class="result-actions"><button class="main-btn" id="scanAgain">Scan Another Ticket</button><button class="secondary-btn" id="viewCheckin">View Checked-in Attendees</button></div>
</div></div>
<script src="backend.js"></script><script src="app.js"></script></body></html>
