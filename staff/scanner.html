<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Eventify - Scan</title><link rel="stylesheet" href="style.css"></head>
<body data-page="scanner">
<div class="scanner-page">
<header class="scanner-head"><button class="back" id="backDashboard">← Back</button><div><h1 class="scanner-title" id="eventName">Event</h1><p class="scanner-sub" id="eventInfo"></p></div></header>
<div class="scanner-body"><div class="scanner-box-wrap">
<div class="camera-box"><video id="camera" autoplay playsinline muted class="hidden"></video><div id="placeholder" class="camera-placeholder">Requesting camera access...</div><div class="scan-frame"></div></div>
<p class="camera-label">Position the attendee QR code inside the box</p>
<div class="test-controls"><button data-result="confirmed">Test Confirmed</button><button data-result="duplicate">Test Duplicate</button><button data-result="invalid">Test Invalid QR</button></div>
<button class="checked-btn" id="checkedIn">View Checked-in Attendees</button>
</div></div></div>
<script src="backend.js"></script><script src="app.js"></script></body></html>
