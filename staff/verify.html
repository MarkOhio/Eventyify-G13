<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Eventify - Verify Email</title><link rel="stylesheet" href="style.css"></head>
<body data-page="verify">
<div class="page">
<div class="auth-side"><div class="side-content"><div class="side-logo">Eventify</div><div class="side-title">Verify your<br>email.</div><div class="side-text">One more step before you can start checking guests in.</div></div></div>
<div class="auth-main"><div class="auth-box">
<div class="logo">Eventify</div><h1 class="auth-title">Verify your email</h1><p class="auth-sub">Enter the 6 digit code sent to <span id="emailText"></span></p>
<form id="verifyForm"><div class="code-row"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div><button class="main-btn" type="submit">Verify Email</button></form>
<div id="message" class="message"></div><p class="text-link">Didn't receive it? <button id="resend" type="button">Resend code</button></p>
</div></div></div>
<script src="backend.js"></script><script src="app.js"></script></body></html>
