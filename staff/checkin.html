<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Eventify - Check-in History</title><link rel="stylesheet" href="style.css"></head>
<body data-page="checkin">
<div class="checkin-page">
<header class="topbar"><div class="top-logo">Eventify</div><div class="top-user"><button class="back" id="dashboardLink">Dashboard</button></div></header>
<main class="history"><div class="history-head"><div><h1>Check-in History</h1><p id="historyEvent">All attendee check-ins</p></div><button class="scan-btn" id="backScan">Back to Scan</button></div>
<div class="table-wrap"><table><thead><tr><th>Attendee</th><th>Ticket</th><th>Scan</th><th>Status</th></tr></thead><tbody id="attendees"></tbody></table></div>
</main></div>
<script src="backend.js"></script><script src="app.js"></script></body></html>
