<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets & Codes - Eventify Organizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="tickets" data-protected="yes">
    <div id="navArea"></div>
    <div class="main">
        <input type="file" id="codesFile" accept=".csv,.txt" class="hidden">
        <div class="page-title-row only-mobile">
            <a class="back" href="create-event.html" data-back aria-label="Back"></a>
            <h1 class="title" style="font-size:18px">Upload/Manage Ticket Codes</h1>
        </div>
        <div class="page-head only-desktop">
            <div><h1>Tickets &amp; Codes</h1><p>Upload and manage ticket codes for an event.</p></div>
        </div>

        <div class="upload-grid">
            <div>
                <div class="upload-zone">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m12 16V9m0 0-3 3m3-3 3 3"/></svg>
                    <p>Upload Ticket Code here</p>
                    <small>CSV or TXT with a code column</small>
                </div>
                <button class="btn btn-outline" id="chooseFile" type="button">Choose file</button>
                <button class="btn btn-outline" id="downloadCodes" type="button" style="margin-top:10px">Download CSV</button>
                <p class="file-msg" id="fileMsg"></p>
            </div>
            <div id="uploadedBlock">
                <h2 class="section-title" id="uploadedTitle" style="margin-top:26px">Uploaded Tickets</h2>
                <div class="ticket-list" id="codesList" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script src="backend.js"></script>
    <script src="common.js"></script>
    <script src="ticket-codes.js"></script>
</body>
</html>
