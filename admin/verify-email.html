<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email - Eventify Organizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth">
        <div class="auth-side only-desktop">
            <div class="side-logo">
                <div class="logo-box"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18v-6a6 6 0 0 1 6-6h6"/><path d="M30 6h6a6 6 0 0 1 6 6v6"/><path d="M6 30v6a6 6 0 0 0 6 6h6"/><path d="M30 42h6a6 6 0 0 0 6-6v-6"/><circle cx="24" cy="24" r="3" fill="#fff" stroke="none"/></svg></div>
                <span class="script">Eventify</span>
            </div>
            <div class="side-text">
                <h2>Smarter Events.</h2>
                <p>Register, Check-ins better experience.</p>
                <div class="side-note">
                    <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff4df" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.2-2.4 3.2-3.5 5.5-3.5s4.3 1.1 5.5 3.5"/></svg>
                    <span>Create, manage and track your events<br>all in one place.</span>
                </div>
            </div>
        </div>
        <div class="auth-main">
            <div class="verify-box">
                <a href="signup.html" class="back-arrow" aria-label="Back"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg></a>
                <h1>Verify your email</h1>
                <p class="sub">Enter the 6 digit code sent to your email.</p>
                <div class="otp-boxes" id="otpBoxes">
                    <input type="text" maxlength="1" inputmode="numeric">
                    <input type="text" maxlength="1" inputmode="numeric">
                    <input type="text" maxlength="1" inputmode="numeric">
                    <input type="text" maxlength="1" inputmode="numeric">
                    <input type="text" maxlength="1" inputmode="numeric">
                    <input type="text" maxlength="1" inputmode="numeric">
                </div>
                <p id="otpError">Incorrect code. Try again.</p>
                <button type="button" id="resendBtn">Resend code</button>
            </div>
        </div>
    </div>

    <script src="backend.js"></script>
    <script src="script.js"></script>
</body>
</html>
