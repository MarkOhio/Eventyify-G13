<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Eventify Organizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
    <div id="navArea"></div>
    <div class="app-main">
        <div class="mobile-top only-mobile">
            <div class="logo-box"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18v-6a6 6 0 0 1 6-6h6"/><path d="M30 6h6a6 6 0 0 1 6 6v6"/><path d="M6 30v6a6 6 0 0 0 6 6h6"/><path d="M30 42h6a6 6 0 0 0 6-6v-6"/><circle cx="24" cy="24" r="3" fill="#fff" stroke="none"/></svg></div>
            <span class="script">Eventify</span>
        </div>
        <div class="page-card">
            <div class="dash-top">
                <div>
                    <h1><span class="hello-line">Good Morning,</span> <span id="greetName"></span> &#128075;</h1>
                    <p class="dash-sub">Here’s what’s happening with your events.</p>
                </div>
                <div class="date-range only-desktop">
                    <span>Sep 27 -Oct 17, 2026</span>
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <svg class="stat-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff4df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                    <div>
                        <p class="stat-label">Total Events</p>
                        <p class="stat-value" id="totalEvents">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <svg class="stat-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff4df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M10 14a2 2 0 1 1 3 1.700c-.6.400-1 .800-1 1.300M12 19v.1"/></svg>
                    <div>
                        <p class="stat-label">Total Attendance</p>
                        <p class="stat-value" id="totalAttendance">0</p>
                    </div>
                </div>
                <div class="stat-card only-desktop">
                    <svg class="stat-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff4df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/></svg>
                    <div>
                        <p class="stat-label">Total Tickets</p>
                        <p class="stat-value" id="totalTickets">0</p>
                    </div>
                </div>
                <div class="stat-card only-desktop">
                    <svg class="stat-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff4df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/></svg>
                    <div>
                        <p class="stat-label">Pending</p>
                        <p class="stat-value" id="pendingCount">0</p>
                    </div>
                </div>
            </div>

            <div class="dash-grid">
                <div>
                    <div class="section-head">
                        <h2>Upcoming Event</h2>
                        <a href="event-details.html" class="view-all">View All</a>
                    </div>
                    <div id="eventList"></div>
                </div>
                <div class="rate-panel">
                    <h2>Attendance Rate</h2>
                    <div class="rate-box">
                        <div class="donut" id="donut"><span id="ratePercent">0%</span></div>
                        <p class="rate-count" id="rateCount"></p>
                        <p class="rate-label">Checked in</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="backend.js"></script>
    <script src="script.js"></script>
</body>
</html>
