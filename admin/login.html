<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Eventify Organizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth">
        <div class="auth-side only-desktop">
            <div class="side-logo">
                <div class="logo-box">
                     <img src="logo.png" alt="">
                </div>
                <span class="script">Eventify</span>
            </div>
            <div class="side-text">
                <h2>Smarter Events.</h2>
                <p>Register, Check-ins better experience.</p>
                <div class="side-note">
                    <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff4df" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.2-2.4 3.2-3.5 5.5-3.5s4.3 1.1 5.5 3.5"/></svg>
                    <span>Create, manage and track your events<br>all in one place.</span>
                </div>
            </div>
        </div>
        <div class="auth-main">
            <form class="auth-box" id="loginForm">
                <div class="brand-block only-mobile">
                    <h1 class="script">Eventify</h1>
                </div>
                <div class="desktop-head only-desktop">
                    <h2>Welcome Back</h2>
                    <p>Log in to continue to your event</p>
                </div>

                <div class="field">
                    <label for="loginEmail"><span class="only-mobile">Email</span><span class="only-desktop">Email address</span></label>
                    <div class="input-wrap"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input type="email" id="loginEmail" placeholder="Enter email address"></div>
                </div>
                <div class="field">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrap pass-wrap"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 10V8a6 6 0 0 1 12 0v2h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1h1zm2 0h8V8a4 4 0 0 0-8 0v2z"/></svg><input type="password" id="loginPassword" placeholder="Enter Password"><button type="button" class="eye" data-eye="loginPassword" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C6.5 5 2.7 9 1 12c1.7 3 5.5 7 11 7s9.3-4 11-7c-1.7-3-5.5-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button></div>
                </div>

                <div class="row-options">
                    <label><input type="checkbox" id="remember"> Remember me</label>
                    <a href="#" id="forgotLink">Forgot password?</a>
                </div>

                <p class="error-text" id="errorText"></p>

                <button type="submit" class="btn-main">Log in</button>
                <button type="button" class="btn-main btn-social btn-google only-mobile" id="googleBtn"><b style="font-size:17px;font-family:Poppins">G</b> Sign in with Google</button>
                <button type="button" class="btn-main btn-social only-mobile" id="appleBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 7c-1.800-1.600-6-1.200-6 3.500 0 4.500 3.500 10 6 10s6-5.500 6-10C18 5.800 13.800 5.400 12 7z"/><path d="M12 6c0-2 1-3.500 3-4 0 2-1 3.500-3 4z"/></svg> Sign in with Apple</button>

                <p class="auth-link">Don’t have an account? <a href="signup.html">Sign up</a></p>
            </form>
        </div>
    </div>

    <script src="backend.js"></script>
    <script src="script.js"></script>
</body>
</html>
