<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400&family=Kaushan+Script&family=Poppins:wght@100;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="screen" id="verify">
        <div class="container">
            <a class="back" href="assigned-ticket-code.html" aria-label="Back">
                <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
            </a>
            <h2 class="page-title">Verify Your Ticket</h2>
            <p class="verify-text">Enter the verification code has been sent to your email address to check your ticket status</p>
            <input type="text" id="code" placeholder="Enter code here" inputmode="numeric">
            <button class="btn" id="verifyButton">Verify</button>
            <p class="resend">Didn’t get a code? <button type="button" id="resendButton">Resend</button></p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
