<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400&family=Kaushan+Script&family=Poppins:wght@100;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="screen" id="landing">
        <div class="container event-layout">
            <div class="event-image">
                <img src="https://www.figma.com/api/mcp/asset/17cecf5f-8eb3-45af-b1d1-a0ca9fa8706c/6aeac.png" alt="Conference stage and audience" onerror="this.remove()">
            </div>
            <div class="event-info">
                <h2 class="event-title">Annual Tech Conference</h2>
                <p class="event-line">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                    Sat, Oct 17th, 2026 - 8:00 AM
                </p>
                <p class="event-line">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
                    Lagos, Nigeria.
                </p>
            </div>
            <a class="btn" href="event-details.html">Get Ticket</a>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
